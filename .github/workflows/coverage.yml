name: Coverage

on:
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'Directory.Build.*'
      - 'Directory.Packages.*'
      - 'Tests/**'
      - 'SQLite.Framework*/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'Directory.Build.*'
      - 'Directory.Packages.*'
      - 'Tests/**'
      - 'SQLite.Framework*/**'
      - '.github/workflows/coverage.yml'

permissions:
  contents: read

jobs:
  test-results:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - SQLite.Framework.Tests
          - SQLite.Framework.Tests.Bundled
          - SQLite.Framework.Tests.Cipher
          - SQLite.Framework.Tests.Base
          - SQLite.Framework.Tests.SourceGenerator
          - SQLite.Framework.Tests.DependencyInjection
          - SQLite.Framework.Tests.AotMigrate
    name: Test results (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x
      - name: Run tests
        run: |
          dotnet run --project Tests/${{ matrix.project }}/${{ matrix.project }}.csproj -c Release -f net11.0 -p:SQLiteFrameworkTestTargetFramework=net11.0 \
            -- --report-xunit-junit \
               --report-xunit-junit-filename ${{ matrix.project }}.junit.xml \
               --results-directory TestResults
      - name: Upload test results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: junit-${{ matrix.project }}
          path: TestResults/${{ matrix.project }}.junit.xml

  upload-test-results:
    runs-on: ubuntu-latest
    needs: [test-results]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    name: Upload test results to Codecov
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download all test result artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: junit-*
          merge-multiple: true
          path: TestResults
      - name: Upload combined test results to Codecov
        uses: codecov/test-results-action@v1.2.1
        with:
          files: TestResults/*.junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - SQLite.Framework.Tests
          - SQLite.Framework.Tests.Bundled
          - SQLite.Framework.Tests.Cipher
          - SQLite.Framework.Tests.Base
          - SQLite.Framework.Tests.NoOp
          - SQLite.Framework.Tests.SourceGenerator
          - SQLite.Framework.Tests.DependencyInjection
          - SQLite.Framework.Tests.AotMigrate
    name: Coverage (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x
      - name: Install coverlet
        run: dotnet tool install --global coverlet.console
      - name: Build tests
        run: dotnet build Tests/${{ matrix.project }}/${{ matrix.project }}.csproj -c Release -f net11.0 -p:SQLiteFrameworkTestTargetFramework=net11.0
      - name: Collect coverage
        run: |
          DLL="Tests/${{ matrix.project }}/bin/Release/net11.0/${{ matrix.project }}.dll"
          if [ ! -f "$DLL" ]; then
            DLL="Tests/${{ matrix.project }}/bin/Release/net11.0/linux-x64/${{ matrix.project }}.dll"
          fi
          coverlet "$DLL" \
            --target dotnet \
            --targetargs "exec $DLL" \
            --include "[SQLite.Framework]*" \
            --include "[SQLite.Framework.DependencyInjection]*" \
            --exclude-by-file "**/obj/**" \
            --format cobertura \
            --output coverage.cobertura.xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.project }}
          path: coverage.cobertura.xml

  upload-coverage:
    runs-on: ubuntu-latest
    needs: [coverage]
    permissions:
      contents: read
    name: Merge and upload coverage to Codecov
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: Require complete merged coverage
        run: |
          python -m unittest Tests.test_report
          python - <<'PYTHON'
          from pathlib import Path
          from Tests.test_report import compute_stats, parse_cobertura
          reports = list(Path("coverage-reports").glob("**/coverage.cobertura.xml"))
          assert len(reports) == 8, f"Expected 8 coverage reports, found {len(reports)}"
          stats = compute_stats([parse_cobertura(path) for path in reports])
          assert stats.lines_valid > 0 and stats.branches_valid > 0, "Coverage report is empty"
          assert stats.lines_covered == stats.lines_valid, f"Line coverage: {stats.lines_covered}/{stats.lines_valid}"
          assert stats.branches_covered == stats.branches_valid, f"Branch coverage: {stats.branches_covered}/{stats.branches_valid}"
          PYTHON
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool
      - name: Merge coverage reports
        run: |
          reportgenerator \
            "-reports:coverage-reports/**/coverage.cobertura.xml" \
            "-targetdir:merged-coverage" \
            "-reporttypes:Cobertura"
      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: merged-coverage/Cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          skip_validation: true
